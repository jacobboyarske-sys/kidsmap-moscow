[theme]
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true

font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
headingFontSizes = ["48px", "36px", "28px", "22px", "18px", "16px"]

chartCategoricalColors = [
    "#9c27b0",
    "#ff9800",
    "#3f51b5",
    "#4caf50",
    "#f44336",
    "#00bcd4",
    "#ffc107",
    "#1976d2",
]

[theme.light]
primaryColor = "#16A34A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0FDF4"
textColor = "#1F2328"
linkColor = "#16A34A"
greenColor = "#16A34A"
borderColor = "#E4E4E7"

[theme.light.sidebar]
backgroundColor = "#F0FDF4"
secondaryBackgroundColor = "#DCFCE7"
borderColor = "#E4E4E7"
primaryColor = "#16A34A"

[theme.dark]
primaryColor = "#22C55E"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
linkColor = "#4ADE80"
greenColor = "#4ADE80"
borderColor = "#30363D"

[theme.dark.sidebar]
backgroundColor = "#0A120D"
secondaryBackgroundColor = "#132018"
borderColor = "#243228"
primaryColor = "#22C55E"
