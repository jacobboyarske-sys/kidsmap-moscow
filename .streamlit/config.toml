[theme]
base = "light"
primaryColor = "#16A34A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0FDF4"
textColor = "#1F2328"
linkColor = "#16A34A"
greenColor = "#16A34A"
borderColor = "#E4E4E7"
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true

font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
headingFontSizes = ["48px", "36px", "28px", "22px", "18px", "16px"]

chartCategoricalColors = [
    "#9c27b0",
    "#ff9800",
    "#3f51b5",
    "#4caf50",
    "#f44336",
    "#00bcd4",
    "#ffc107",
    "#1976d2",
]

[theme.sidebar]
backgroundColor = "#F0FDF4"
secondaryBackgroundColor = "#DCFCE7"
borderColor = "#E4E4E7"
primaryColor = "#16A34A"
